x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  environment:
    DB_HOST: db
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: bin/rails db:prepare
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  jobs:
    <<: *app
    command: bin/jobs
    restart: unless-stopped

volumes:
  pgdata:
  bundle:
